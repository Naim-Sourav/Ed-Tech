<link rel="icon" type="image/svg+xml" href="/Pshape.svg" />
<style>
  body{font-family:'Hind Siliguri',system-ui,sans-serif;background:#f9fafb;color:#111827;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px}
  .card{max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:40px 28px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
  h1{font-size:28px;margin:12px 0 8px}
  p{color:#6b7280;line-height:1.7;margin:8px 0 20px}
  a.btn{display:inline-block;background:#f97316;color:#fff;font-weight:700;text-decoration:none;padding:12px 26px;border-radius:12px;margin:4px}
  a.link{display:inline-block;color:#f97316;font-weight:600;text-decoration:none;margin:4px 10px}
  .logo{width:56px;height:56px}
</style>
<script>
  // GitHub Pages has no server-side rewrites: send known app routes back into
  // the SPA (BrowserRouter) so shared deep links (e.g. /privacy) keep working.
  // The ?p= payload is restored to the clean URL by index.html on boot.
  (function () {
    if (location.search.indexOf('p=') !== -1) return; // already a redirect payload
    var known = ['auth','privacy','terms','refund','dashboard','courses','qbank','exams','quiz','battle','leaderboard','planner','history','admission','profile','saved-questions','wrong-questions','settings','account','challenges','bot','exam','exam-batch','payment','question','q'];
    var path = location.pathname.replace(/\/+$/, '') || '/';
    var seg = path.split('/')[1] || '';
    if (seg === 'hsc-syllabus') { location.replace('/hsc-syllabus/'); return; }
    // Previous-year admission papers: static pages exist for every sitting we
    // have data for; anything else is rendered live by the SPA from the DB.
    if (seg === 'admission-questions') {
      location.replace('/?p=' + encodeURIComponent(path + location.search));
      return;
    }
    if (seg && known.indexOf(seg) !== -1) {
      location.replace('/?p=' + encodeURIComponent(path + location.search));
      return;
    }
    if (seg === '') { location.replace('/'); }
  })();
</script>

    <a class="btn" href="/">হোমপেজে যান</a>
    <div>
      <a class="link" href="/hsc-syllabus/">HSC সিলেবাস গাইড</a>

    </div>
