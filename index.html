    <!-- MathJax (~1 MB) is deferred until after first paint / idle so it no
         longer competes with the landing page for bandwidth (Core Web Vitals).
         startup.typeset:true still typesets the whole document once loaded. -->
    <script>
      (function () {
        var SRC = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
        function loadMathJax() {
          if (document.getElementById('MathJax-script')) return;
          var s = document.createElement('script');
          s.id = 'MathJax-script';
          s.async = true;
          s.src = SRC;
          document.head.appendChild(s);
        }
        window.addEventListener('load', function () {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadMathJax, { timeout: 2500 });
          } else {
            window.setTimeout(loadMathJax, 1200);
          }
        }, { once: true });
      })();
    </script>

    <script>
      /* Theme applied before the first paint (and before React) so neither the
         splash nor the app can flash the wrong colours. `themeMode` is the app's
         own key (light | dark | system); the landing toggle writes the same key,
         so both stay in agreement. */
      (function () {
        try {
          var mode = localStorage.getItem('themeMode');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = mode === 'dark' || ((!mode || mode === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
    </script>
