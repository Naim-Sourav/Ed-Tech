    <script>
      tailwind.config = {

            fontFamily: {

              tiro: ['Kalpurush', 'sans-serif'],

              'fade-in': 'fadeIn 0.3s ease-out forwards',

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],

        options: {
          enableMenu: false,
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        },
        chtml: { scale: 1, minScale: 0.5 },

      body {
        font-family: 'Hind Siliguri', sans-serif;
        margin: 0;
        padding: 0;
        /* App-like Behavior CSS */
        -webkit-tap-highlight-color: transparent; /* Remove blue tap box */

        overscroll-behavior-y: none; /* Disable pull-to-refresh */
        touch-action: pan-y; /* Optimize touch */

      /* Allow text selection only in specific readable areas if needed */
      p, h1, h2, h3, h4, h5, span, article {

        -webkit-user-select: text;
      }
      
      /* Smooth Scrolling */
      html {
        scroll-behavior: smooth;
      }
      
      /* Custom Scrollbar (Hidden mostly for mobile feel) */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb { background: #374151; }

      /* MJX Fix */
      mjx-container {
        display: inline-block !important;
        margin: 0 2px !important;
        vertical-align: middle !important;
      }

      /* Loader */

        position: fixed; top: 0; left: 0; width: 100%; height: 100%;

      }

        #app-loading p { color: #9ca3af !important; }

        font-weight: bold; color: #1565C0; box-shadow: 0 10px 25px rgba(21, 101, 192, 0.2);
        margin-bottom: 24px; animation: bounce 2s infinite;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    </style>
