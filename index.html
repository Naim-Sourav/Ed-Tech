
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Porikkhangon | HSC & Admission AI Tutor</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Porikkhangon">
    <meta name="application-name" content="Porikkhangon">
    <link rel="apple-touch-icon" href="./Pshape.svg">

    <!-- Standard SEO -->
    <meta name="description" content="Porikkhangon (পরীক্ষাঙ্গন) - An AI-powered comprehensive learning assistant for Bangladeshi HSC and Admission students." />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
    
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        options: {
          enableMenu: false,
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        },
        chtml: { scale: 1, minScale: 0.5 },
        startup: { typeset: true }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <div id="root" class="h-full w-full">
      <div id="app-loading">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;" class="animate-pulse">
          <img src="./Pshape.svg" alt="Porikkhangon Logo" style="width: 64px; height: 64px;" />
          <img src="./letterlogo.svg" alt="Porikkhangon Letter Logo" style="height: 32px; width: auto;" />
        </div>
        <p class="loading-text text-sm font-bold opacity-70">পরীক্ষাঙ্গন প্রস্তুত হচ্ছে...</p>
      </div>
    </div>
    <script>
      // Force unregister existing SW if any
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
