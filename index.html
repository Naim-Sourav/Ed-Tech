    <style>
      body {
        font-family: 'Hind Siliguri', sans-serif;
        margin: 0;
        padding: 0;
      }
      
      /* --- MATHJAX FIX: Prevents breaking text --- */
      mjx-container {
        display: inline-block !important;
        margin: 0 2px !important;
        vertical-align: middle !important;
        max-width: 100% !important;
        line-height: 0 !important;
      }
      
      mjx-container[display="true"] {
        display: block !important;
        margin: 1em 0 !important;
        text-align: center !important;
      }

      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      .dark ::-webkit-scrollbar-track {
        background: #1f2937; 
      }
      ::-webkit-scrollbar-thumb {
        background: #90CAF9; /* Light blue tint */
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #1E88E5; /* Dark blue tint */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1565C0; 
      }
      /* Global transition for smooth theme switching */
      *, *::before, *::after {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 200ms;
      }

      /* Pre-loader Styles */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f9fafb; /* gray-50 */
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      @media (prefers-color-scheme: dark) {
        #app-loading {
          background-color: #111827; /* gray-900 */
        }
        #app-loading .logo-box {
          background-color: #1f2937 !important; /* gray-800 */
          color: #fff !important;
        }
        #app-loading p {
          color: #9ca3af !important; /* gray-400 */
        }
      }
      .logo-box {
        width: 80px;
        height: 80px;
        background-color: #fff;
        border-radius: 50%; /* Circle like logo */
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: bold;
        color: #1565C0; /* Blue */
        box-shadow: 0 10px 25px rgba(21, 101, 192, 0.2);
        margin-bottom: 24px;
        animation: pulse 2s infinite;
        border: 4px solid #E3F2FD;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top: 4px solid #1565C0; /* Blue */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loading-text {
        margin-top: 16px;
        color: #4b5563;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
