name: Build Android APK

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Core and Android Packages
        run: npm install @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps

      - name: Build Web Project
        run: npm run build 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Capacitor Config if missing
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.porikkhangon.app", "appName": "Porikkhangon", "webDir": "dist"}' > capacitor.config.json
          fi

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # GRADLE_USER_HOME পরিবর্তন করে ওয়ার্কস্পেসে আনা হয়েছে যাতে জার ফাইল তৈরিতে পারমিশন এরর না আসে
      - name: Build Android APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-web-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
