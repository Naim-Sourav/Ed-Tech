name: Build Android APK

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Detect Android build prerequisites
        id: android_prereq
        run: |
          has_android_dir=false
          has_cap_config=false
          has_cap_dep=false

          if [ -d "android" ]; then
            has_android_dir=true
          fi

          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            has_cap_config=true
          fi

          if grep -q '"@capacitor/core"' package.json; then
            has_cap_dep=true
          fi

          if [ "$has_android_dir" = "true" ] && [ "$has_cap_config" = "true" ] && [ "$has_cap_dep" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Android build because Android/Capacitor setup is not present in the repository."
          fi

      - name: Build Web Project
        run: npm run build 

      - name: Set up JDK 17
        if: steps.android_prereq.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor
        if: steps.android_prereq.outputs.enabled == 'true'
        run: |
          npx @capacitor/cli sync

      # Keep Gradle resource usage conservative to reduce CI instability.
      - name: Build Android APK
        if: steps.android_prereq.outputs.enabled == 'true'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=1 --no-parallel

      - name: Upload APK Artifact
        if: steps.android_prereq.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-web-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
