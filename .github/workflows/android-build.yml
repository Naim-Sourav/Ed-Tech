name: Build Android APK

on:
  push:
    branches: [ main ] # আপনার মেইন ব্রাঞ্চের নাম 'master' হলে এখানে master লিখবেন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # আপনার প্রজেক্টের নোড ভার্সন অনুযায়ী পরিবর্তন করতে পারেন

      - name: Install Dependencies
        # TODO: Remove --legacy-peer-deps after upgrading to React 19 or pinning @react-three/* to React 18-compatible versions.
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build # আপনার ওয়েব অ্যাপের বিল্ড কমান্ড (যেমন: Vite বা Next.js বিল্ড)

      - name: Detect Capacitor Android setup
        id: capacitor_check
        run: |
          if [ -d android ] && [ -f capacitor.config.ts -o -f capacitor.config.json ] && [ -f package.json ] && grep -q '"@capacitor/core"' package.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Capacitor Android setup not found. Skipping Android build steps."
          fi

      - name: Set up JDK 17
        if: steps.capacitor_check.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor
        if: steps.capacitor_check.outputs.enabled == 'true'
        run: |
          npx cap sync

      - name: Build Android APK
        if: steps.capacitor_check.outputs.enabled == 'true'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        if: steps.capacitor_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-web-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
