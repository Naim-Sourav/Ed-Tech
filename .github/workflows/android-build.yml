name: Build Android APK

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Core and Android Packages
        run: npm install @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Build Web Project
        run: npm run build 

      # এখানে জাবানি ডিস্ট্রিবিউশন 'temurin' করা হয়েছে যা বেশি স্ট্যাবল
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Capacitor Config if missing
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.porikkhangon.app", "appName": "Porikkhangon", "webDir": "dist"}' > capacitor.config.json
          fi

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi

      - name: Sync Capacitor
        run: |
          npx @capacitor/cli sync

      # এখানে --no-daemon যুক্ত করা হয়েছে যাতে কনকারেন্সি এরর না আসে
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-web-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
