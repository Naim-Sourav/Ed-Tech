name: Build Android APK

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ১. এই ধাপটি প্রজেক্টে সরাসরি অ্যান্ড্রয়েড প্যাকেজ ইন্সটল করবে
      - name: Install Capacitor Android Package
        run: npm install @capacitor/android --legacy-peer-deps

      - name: Build Web Project
        run: npm run build 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ২. যদি কনফিগারেশন ফাইল না থাকে, তবে এটি অটোমেটিক appId ও webDir সেট করে ফাইল বানিয়ে নেবে
      - name: Create Capacitor Config if missing
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.porikkhangon.app", "appName": "Porikkhangon", "webDir": "dist"}' > capacitor.config.json
          fi

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi

      - name: Sync Capacitor
        run: |
          npx @capacitor/cli sync

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-web-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
