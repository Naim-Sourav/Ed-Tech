name: TEMP — API reachability probe

# Throw-away diagnostic: figures out why the audit job cannot download the
# question bank (TLS fingerprint? user agent? cold start?). Delete after use.

on:
  push:
    branches: [arena/01a0ce52-ed-tech]
    paths: ['.github/workflows/api-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. plain fetch, 60s budget
        run: |
          node -e "
          const t=Date.now();
          fetch('https://mongodb-hb6b.onrender.com/api/admin/questions?page=1&limit=5',{signal:AbortSignal.timeout(60000)})
            .then(r=>r.text()).then(x=>console.log('::notice title=probe1 plain::ok',x.length,'bytes in',Date.now()-t,'ms'))
            .catch(e=>console.log('::warning title=probe1 plain::FAILED '+e.name+' '+e.message+' after '+(Date.now()-t)+'ms'));
          "
        continue-on-error: true

      - name: 2. browser-like headers, 60s budget
        run: |
          node -e "
          const t=Date.now();
          fetch('https://mongodb-hb6b.onrender.com/api/admin/questions?page=1&limit=5',{
            signal:AbortSignal.timeout(60000),
            headers:{
              'accept':'application/json, text/plain, */*',
              'accept-language':'en-US,en;q=0.9,bn;q=0.8',
              'origin':'https://www.porikkhangon.app',
              'referer':'https://www.porikkhangon.app/',
              'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
            }})
            .then(r=>r.text()).then(x=>console.log('::notice title=probe2 browser-headers::ok',x.length,'bytes in',Date.now()-t,'ms'))
            .catch(e=>console.log('::warning title=probe2 browser-headers::FAILED '+e.name+' '+e.message+' after '+(Date.now()-t)+'ms'));
          "
        continue-on-error: true

      - name: 3. curl with browser UA vs curl default
        run: |
          set +e
          for mode in default browser; do
            if [ "$mode" = "browser" ]; then
              hdr=(-H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36' -H 'Accept: application/json')
            else
              hdr=()
            fi
            out=$(curl -sS --max-time 45 -o /tmp/out.json -w '%{http_code} %{time_total}s' "${hdr[@]}" 'https://mongodb-hb6b.onrender.com/api/admin/questions?page=1&limit=5' 2>&1)
            bytes=$(wc -c < /tmp/out.json 2>/dev/null || echo 0)
            echo "::notice title=probe3 curl $mode::status=$out bytes=$bytes"
          done

      - name: 4. other hosts + DNS/TLS detail
        run: |
          set +e
          echo "::notice title=probe4 dns::$(getent hosts mongodb-hb6b.onrender.com | head -2 | tr '\n' ' ')"
          for url in https://www.porikkhangon.app/ https://mongodb-hb6b.onrender.com/ https://example.com/; do
            code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code} %{time_total}s' "$url" 2>&1)
            echo "::notice title=probe4 $url::$code"
          done
          echo "::notice title=probe4 openssl::$(echo | timeout 25 openssl s_client -connect mongodb-hb6b.onrender.com:443 -servername mongodb-hb6b.onrender.com 2>&1 | head -5 | tr '\n' '|' | tr -d '\"' | cut -c1-300)"
