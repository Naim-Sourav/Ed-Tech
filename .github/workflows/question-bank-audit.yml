name: Question Bank — Fetch & Audit

# Downloads the whole question bank from the backend and runs the quality
# audit (duplicates, doubled "Explanation" blocks, broken options, mojibake…).
#
# Run it from the Actions tab → "Question Bank — Fetch & Audit" → Run workflow.
# Artifacts produced:
#   exports/question-bank.ndjson     every raw question from the API
#   exports/audit-report.md          human readable findings
#   exports/audit-report.json        machine readable findings
#   exports/fix-plan.json            the exact updates/merges needed to clean it
#
# Local equivalent:
#   node scripts/fetch-question-bank.mjs
#   node scripts/question-bank-audit.mjs --file exports/question-bank.ndjson

on:
  # TEMPORARY: lets the current working branch trigger the audit while the
  # workflow does not exist on main yet (GitHub only allows manual dispatch of
  # workflows present on the default branch). Remove after the first merge.
  push:
    branches: [arena/01a0ce52-ed-tech]
    paths:
      - '.github/workflows/question-bank-audit.yml'
      - 'scripts/fetch-question-bank.mjs'
      - 'scripts/question-bank-audit.mjs'
      - 'utils/questionQuality.ts'
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API base URL'
        required: false
        default: 'https://mongodb-hb6b.onrender.com/api'
      limit:
        description: 'Questions per request (keep modest — the API is slow for big pages)'
        required: false
        default: '250'
      max_pages:
        description: 'Safety cap on requests'
        required: false
        default: '100'
      filter:
        description: 'Extra query string (e.g. subject=Physics 1st Paper)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 imports utils/questionQuality.ts directly (native type
          # stripping) — no npm install needed for the audit job.
          node-version: '22'

      - name: Probe the API
        env:
          API_BASE: ${{ inputs.api_base || 'https://mongodb-hb6b.onrender.com/api' }}
        run: |
          node -e "
            const base = process.env.API_BASE;
            const t = Date.now();
            fetch(base + '/admin/questions?page=1&limit=5')
              .then(r => r.json())
              .then(d => console.log('probe ok:', (d.questions||[]).length, 'rows, total', d.total, 'in', Date.now()-t, 'ms'))
              .catch(e => { console.log('::error title=API probe::' + e.message); process.exit(1); });
          "
        timeout-minutes: 3

      - name: Fetch full question bank
        env:
          API_BASE: ${{ inputs.api_base || 'https://mongodb-hb6b.onrender.com/api' }}
          PAGE_LIMIT: ${{ inputs.limit || '250' }}
          MAX_PAGES: ${{ inputs.max_pages || '100' }}
          FILTER: ${{ inputs.filter || '' }}
        run: |
          node scripts/fetch-question-bank.mjs \
            --api "$API_BASE" \
            --out exports/question-bank.ndjson \
            --limit "$PAGE_LIMIT" \
            --max-pages "$MAX_PAGES" \
            ${FILTER:+--filter "$FILTER"}

      - name: Audit question quality
        run: |
          node scripts/question-bank-audit.mjs \
            --file exports/question-bank.ndjson \
            --out exports \
            --report exports/audit-report.md \
            --json exports/audit-report.json \
            --plan exports/fix-plan.json

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Question bank audit"
            echo
            if [ -f exports/audit-report.md ]; then
              cat exports/audit-report.md
            else
              echo "_Audit did not run (the fetch failed) — see the job log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-bank-audit
          path: exports/
          if-no-files-found: warn
          retention-days: 14
